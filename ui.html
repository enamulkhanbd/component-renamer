<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bulk Component Renamer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-tertiary: #334155;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent: #4caf4f;
      --accent-hover: #3d8c40;
      --accent-alpha: rgba(76, 175, 79, 0.15);
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.1);
      --error: #ef4444;
      --error-bg: rgba(239, 68, 68, 0.1);
      --warning: #f59e0b;
      --warning-bg: rgba(245, 158, 11, 0.1);
      --border: #334155;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-size: 13px;
      line-height: 1.5;
      padding: 16px;
      overflow-x: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    h1, h2, h3 {
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
    }

    header {
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      font-size: 16px;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    header h1 svg {
      color: var(--accent);
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
      overflow-y: auto;
      padding-right: 2px;
    }

    /* Scrollbar */
    .container::-webkit-scrollbar,
    .results-list::-webkit-scrollbar {
      width: 6px;
    }
    .container::-webkit-scrollbar-track,
    .results-list::-webkit-scrollbar-track {
      background: var(--bg-primary);
    }
    .container::-webkit-scrollbar-thumb,
    .results-list::-webkit-scrollbar-thumb {
      background: var(--bg-tertiary);
      border-radius: 3px;
    }

    /* File Drop Zone */
    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 24px 16px;
      text-align: center;
      background-color: var(--bg-secondary);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--accent);
      background-color: var(--accent-alpha);
    }

    .drop-zone svg {
      width: 32px;
      height: 32px;
      color: var(--text-secondary);
      transition: color 0.2s ease;
    }

    .drop-zone:hover svg {
      color: var(--accent);
    }

    .drop-zone p {
      font-weight: 500;
    }

    .drop-zone span {
      color: var(--text-secondary);
      font-size: 11px;
    }

    .file-input {
      display: none;
    }

    .file-info {
      display: none;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-secondary);
      padding: 10px 12px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    .file-info-text {
      display: flex;
      flex-direction: column;
    }

    .file-info-name {
      font-weight: 600;
      color: var(--text-primary);
    }

    .file-info-size {
      color: var(--text-secondary);
      font-size: 11px;
    }

    .btn-remove-file {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-remove-file:hover {
      background: var(--bg-tertiary);
      color: var(--error);
    }

    /* Options Panel */
    .section-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      margin-bottom: 8px;
      font-weight: 700;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: var(--bg-secondary);
      padding: 12px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    .option-item {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }

    .option-item input[type="checkbox"] {
      appearance: none;
      background-color: var(--bg-tertiary);
      border: 1px solid var(--border);
      width: 16px;
      height: 16px;
      border-radius: 4px;
      display: grid;
      place-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .option-item input[type="checkbox"]::before {
      content: "";
      width: 10px;
      height: 10px;
      transform: scale(0);
      transition: 120ms transform ease-in-out;
      box-shadow: inset 1em 1em var(--text-primary);
      clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
    }

    .option-item input[type="checkbox"]:checked {
      background-color: var(--accent);
      border-color: var(--accent);
    }

    .option-item input[type="checkbox"]:checked::before {
      transform: scale(1);
    }

    .option-item span {
      font-weight: 500;
      color: var(--text-primary);
    }

    .dry-run-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-secondary);
      padding: 12px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    /* Switch Style */
    .switch {
      position: relative;
      display: inline-block;
      width: 34px;
      height: 20px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: var(--bg-tertiary);
      transition: .3s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent);
    }

    input:checked + .slider:before {
      transform: translateX(14px);
    }

    /* Footer Buttons */
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }

    .btn {
      flex: 1;
      padding: 10px 16px;
      border-radius: var(--radius);
      font-weight: 600;
      font-size: 13px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-secondary {
      background-color: var(--bg-secondary);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: var(--bg-tertiary);
    }

    .btn-primary {
      background-color: var(--accent);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--accent-hover);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Results Dashboard */
    .results-dashboard {
      display: none;
      flex-direction: column;
      gap: 12px;
      margin-top: 8px;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .stat-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: var(--radius);
      text-align: center;
    }

    .stat-val {
      font-size: 18px;
      font-weight: 700;
      font-family: 'Outfit', sans-serif;
    }

    .stat-val.updated { color: var(--success); }
    .stat-val.not-found { color: var(--warning); }
    .stat-val.duplicates { color: var(--error); }

    .stat-lbl {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .results-list {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      max-height: 180px;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .result-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 12px;
      padding: 6px 8px;
      border-radius: 4px;
      background: var(--bg-primary);
    }

    .result-item.success {
      border-left: 3px solid var(--success);
    }

    .result-item.warning {
      border-left: 3px solid var(--warning);
    }

    .result-item.error {
      border-left: 3px solid var(--error);
    }

    .result-icon {
      font-weight: bold;
      flex-shrink: 0;
    }

    .result-item.success .result-icon { color: var(--success); }
    .result-item.warning .result-icon { color: var(--warning); }
    .result-item.error .result-icon { color: var(--error); }

    .result-text {
      flex: 1;
      word-break: break-all;
    }

    .validation-errors {
      display: none;
      background: var(--error-bg);
      border: 1px solid var(--error);
      color: #fda4af;
      padding: 10px;
      border-radius: var(--radius);
      font-size: 12px;
      max-height: 100px;
      overflow-y: auto;
    }

    .undo-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      background: var(--success-bg);
      border: 1px solid var(--success);
      padding: 10px;
      border-radius: var(--radius);
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <header>
    <h1>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h9"></path>
        <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
      </svg>
      Bulk Component Renamer
      <span style="font-size: 10px; font-family: 'Inter', sans-serif; color: var(--text-secondary); background: var(--bg-tertiary); padding: 2px 6px; border-radius: 12px; font-weight: 600; margin-left: 6px;">v1.0.0</span>
    </h1>
  </header>

  <div class="container">
    <!-- Drag & Drop Zone -->
    <div id="drop-zone" class="drop-zone">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="17 8 12 3 7 8"></polyline>
        <line x1="12" y1="3" x2="12" y2="15"></line>
      </svg>
      <p>Drag & drop CSV or JSON file</p>
      <span>or click to browse local files</span>
      <input type="file" id="file-input" class="file-input" accept=".csv,.json">
    </div>

    <!-- Uploaded File Info -->
    <div id="file-info" class="file-info">
      <div class="file-info-text">
        <span id="file-info-name" class="file-info-name">mappings.json</span>
        <span id="file-info-size" class="file-info-size">24.5 KB</span>
      </div>
      <button id="btn-remove-file" class="btn-remove-file" title="Remove file">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Validation Errors -->
    <div id="validation-errors" class="validation-errors"></div>

    <!-- Options -->
    <div>
      <div class="section-title">Options</div>
      <div class="options-grid">
        <label class="option-item">
          <input type="checkbox" id="opt-rename" checked>
          <span>Rename Components</span>
        </label>
        <label class="option-item">
          <input type="checkbox" id="opt-description" checked>
          <span>Update Description</span>
        </label>
        <label class="option-item">
          <input type="checkbox" id="opt-component-sets" checked>
          <span>Include Component Sets</span>
        </label>
        <label class="option-item">
          <input type="checkbox" id="opt-components" checked>
          <span>Include Components</span>
        </label>
        <label class="option-item">
          <input type="checkbox" id="opt-lowercase">
          <span>Lowercase names</span>
        </label>
        <label class="option-item">
          <input type="checkbox" id="opt-hyphenate">
          <span>Hyphenate spaces</span>
        </label>
      </div>
    </div>

    <!-- Dry Run toggle -->
    <div class="dry-run-wrapper">
      <div style="display: flex; flex-direction: column;">
        <span style="font-weight: 600;">Dry Run Mode</span>
        <span style="color: var(--text-secondary); font-size: 11px;">Preview changes without writing to file</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="opt-dry-run">
        <span class="slider"></span>
      </label>
    </div>

    <!-- Action Buttons -->
    <div class="actions">
      <button id="btn-import" class="btn btn-secondary">
        Import File
      </button>
      <button id="btn-run" class="btn btn-primary" disabled>
        Run Update
      </button>
    </div>

    <!-- Undo Banner -->
    <div id="undo-banner" class="undo-banner">
      <span style="font-weight: 500; color: var(--success);">Snapshot saved. You can undo the last run.</span>
      <button id="btn-undo" class="btn btn-secondary" style="padding: 4px 10px; font-size: 11px; flex: initial;">Undo Update</button>
    </div>

    <!-- Results Dashboard -->
    <div id="results-dashboard" class="results-dashboard">
      <div class="section-title" id="results-title">Results</div>
      
      <div class="stats-row">
        <div class="stat-card">
          <div id="stat-updated" class="stat-val updated">0</div>
          <div class="stat-lbl">Updated</div>
        </div>
        <div class="stat-card">
          <div id="stat-not-found" class="stat-val not-found">0</div>
          <div class="stat-lbl">Not Found</div>
        </div>
        <div class="stat-card">
          <div id="stat-duplicates" class="stat-val duplicates">0</div>
          <div class="stat-lbl">Duplicates</div>
        </div>
      </div>

      <div id="results-list" class="results-list"></div>

      <button id="btn-download-report" class="btn btn-secondary" style="margin-top: 4px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        Download CSV Report
      </button>
    </div>
  </div>

  <script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const fileInfo = document.getElementById('file-info');
    const fileInfoName = document.getElementById('file-info-name');
    const fileInfoSize = document.getElementById('file-info-size');
    const btnRemoveFile = document.getElementById('btn-remove-file');
    const btnImport = document.getElementById('btn-import');
    const btnRun = document.getElementById('btn-run');
    const validationErrors = document.getElementById('validation-errors');
    
    const resultsDashboard = document.getElementById('results-dashboard');
    const resultsTitle = document.getElementById('results-title');
    const statUpdated = document.getElementById('stat-updated');
    const statNotFound = document.getElementById('stat-not-found');
    const statDuplicates = document.getElementById('stat-duplicates');
    const resultsList = document.getElementById('results-list');
    const btnDownloadReport = document.getElementById('btn-download-report');
    
    const undoBanner = document.getElementById('undo-banner');
    const btnUndo = document.getElementById('btn-undo');

    // Mappings list parsed from file
    let currentMappings = [];
    let lastResults = [];

    // Drag and drop handlers
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length > 0) {
        handleFile(e.dataTransfer.files[0]);
      }
    });

    dropZone.addEventListener('click', () => {
      fileInput.click();
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        handleFile(e.target.files[0]);
      }
    });

    btnImport.addEventListener('click', () => {
      fileInput.click();
    });

    btnRemoveFile.addEventListener('click', () => {
      clearFile();
    });

    function clearFile() {
      fileInput.value = '';
      currentMappings = [];
      fileInfo.style.display = 'none';
      dropZone.style.display = 'flex';
      btnRun.disabled = true;
      validationErrors.style.display = 'none';
    }

    function handleFile(file) {
      const reader = new FileReader();
      const ext = file.name.split('.').pop().toLowerCase();
      
      reader.onload = function(e) {
        const text = e.target.result;
        try {
          validationErrors.style.display = 'none';
          if (ext === 'json') {
            currentMappings = parseJSON(text);
          } else if (ext === 'csv') {
            currentMappings = parseCSV(text);
          } else {
            throw new Error("Unsupported file format. Please upload a .csv or .json file.");
          }

          validateMappings(currentMappings);
          
          // Display file info
          fileInfoName.textContent = file.name;
          fileInfoSize.textContent = formatBytes(file.size);
          dropZone.style.display = 'none';
          fileInfo.style.display = 'flex';
          btnRun.disabled = false;

        } catch (error) {
          showValidationError(error.message);
          clearFile();
        }
      };
      
      reader.readAsText(file);
    }

    function formatBytes(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function showValidationError(message) {
      validationErrors.innerHTML = `<strong>Validation Error:</strong><br>${message.replace(/\n/g, '<br>')}`;
      validationErrors.style.display = 'block';
    }

    function parseJSON(text) {
      try {
        const data = JSON.parse(text);
        if (!Array.isArray(data)) {
          throw new Error("JSON root element must be an array of mapping objects.");
        }
        return data;
      } catch (err) {
        throw new Error("Invalid JSON formatting: " + err.message);
      }
    }

    function parseCSV(text) {
      const lines = [];
      let row = [""];
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        const next = text[i+1];
        if (c === '"') {
          if (inQuotes && next === '"') {
            row[row.length - 1] += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (c === ',' && !inQuotes) {
          row.push("");
        } else if ((c === '\r' || c === '\n') && !inQuotes) {
          if (c === '\r' && next === '\n') {
            i++;
          }
          lines.push(row);
          row = [""];
        } else {
          row[row.length - 1] += c;
        }
      }
      if (row.length > 1 || row[0] !== "") {
        lines.push(row);
      }
      
      if (lines.length < 2) {
        throw new Error("CSV file is empty or missing content rows.");
      }
      
      const headers = lines[0].map(h => h.trim().toLowerCase());
      const currentNameIndex = headers.indexOf("current_name");
      const newNameIndex = headers.indexOf("new_name");
      const descriptionIndex = headers.indexOf("description");
      
      if (currentNameIndex === -1 || newNameIndex === -1) {
        throw new Error("CSV must contain 'current_name' and 'new_name' columns in the first header row.");
      }
      
      const results = [];
      for (let i = 1; i < lines.length; i++) {
        const line = lines[i];
        if (line.length === 0 || (line.length === 1 && line[0] === "")) continue;
        const current_name = line[currentNameIndex]?.trim();
        const new_name = line[newNameIndex]?.trim();
        const description = descriptionIndex !== -1 ? line[descriptionIndex]?.trim() : "";
        if (current_name || new_name) {
          results.push({ current_name, new_name, description });
        }
      }
      return results;
    }

    function validateMappings(mappings) {
      if (mappings.length === 0) {
        throw new Error("No mappings found in file.");
      }
      
      let errors = [];
      const currentNames = new Set();
      
      mappings.forEach((m, index) => {
        const rowNum = index + 2; // 1-indexed plus header row offset
        if (!m.current_name) {
          errors.push(`Row ${rowNum}: missing 'current_name'`);
        }
        if (!m.new_name) {
          errors.push(`Row ${rowNum}: missing 'new_name'`);
        }
        if (m.current_name) {
          if (currentNames.has(m.current_name)) {
            errors.push(`Row ${rowNum}: duplicate mapping entry for current_name '${m.current_name}'`);
          }
          currentNames.add(m.current_name);
        }
      });
      
      if (errors.length > 0) {
        throw new Error(errors.slice(0, 10).join('\n') + (errors.length > 10 ? `\n...and ${errors.length - 10} more errors.` : ''));
      }
    }

    // Run action
    btnRun.addEventListener('click', () => {
      const config = {
        rename: document.getElementById('opt-rename').checked,
        description: document.getElementById('opt-description').checked,
        componentSets: document.getElementById('opt-component-sets').checked,
        components: document.getElementById('opt-components').checked,
        lowercase: document.getElementById('opt-lowercase').checked,
        hyphenate: document.getElementById('opt-hyphenate').checked,
        dryRun: document.getElementById('opt-dry-run').checked
      };

      btnRun.disabled = true;
      btnRun.innerText = config.dryRun ? "Running Preview..." : "Updating Components...";

      parent.postMessage({
        pluginMessage: {
          type: 'run-update',
          mappings: currentMappings,
          config: config
        }
      }, '*');
    });

    btnUndo.addEventListener('click', () => {
      btnUndo.disabled = true;
      parent.postMessage({ pluginMessage: { type: 'undo-update' } }, '*');
    });

    // Handle messages from plugin controller
    window.onmessage = (event) => {
      const message = event.data.pluginMessage;
      if (!message) return;

      if (message.type === 'update-completed') {
        const results = message.results;
        lastResults = results;
        const config = message.config;
        
        btnRun.disabled = false;
        btnRun.innerText = "Run Update";

        // Display results
        resultsDashboard.style.display = 'flex';
        resultsTitle.textContent = config.dryRun ? "Dry Run Preview Results" : "Results";
        
        statUpdated.textContent = message.stats.updated;
        statNotFound.textContent = message.stats.notFound;
        statDuplicates.textContent = message.stats.duplicates;

        resultsList.innerHTML = '';
        results.forEach(res => {
          const item = document.createElement('div');
          item.className = `result-item ${res.status}`;
          
          let icon = '✓';
          if (res.status === 'warning') icon = '⚠';
          if (res.status === 'error') icon = '✗';
          
          item.innerHTML = `
            <span class="result-icon">${icon}</span>
            <div class="result-text">${res.message}</div>
          `;
          resultsList.appendChild(item);
        });

        // Toggle undo banner visibility
        if (message.hasUndo && !config.dryRun) {
          undoBanner.style.display = 'flex';
          btnUndo.disabled = false;
        } else {
          undoBanner.style.display = 'none';
        }
      } else if (message.type === 'undo-completed') {
        btnUndo.disabled = true;
        undoBanner.style.display = 'none';
        
        // Refresh UI state or show success
        const item = document.createElement('div');
        item.className = 'result-item success';
        item.innerHTML = `
          <span class="result-icon">✓</span>
          <div class="result-text">Undo operation completed successfully. Component names restored.</div>
        `;
        resultsList.insertBefore(item, resultsList.firstChild);
      }
    };

    // Download CSV Report
    btnDownloadReport.addEventListener('click', () => {
      if (lastResults.length === 0) return;
      
      let csvContent = "data:text/csv;charset=utf-8,";
      csvContent += "Current Name,New Name,Status,Message\n";
      
      lastResults.forEach(res => {
        const row = [
          res.currentName || "",
          res.newName || "",
          res.status,
          res.message.replace(/"/g, '""')
        ].map(val => `"${val}"`).join(",");
        csvContent += row + "\n";
      });
      
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `rename_report_${Date.now()}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });
  </script>
</body>
</html>
